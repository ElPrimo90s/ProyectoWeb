<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>LogIn</title>
    <link rel="stylesheet" href="logins.css">
</head>
<body>
    <div style="text-align: center;">
        <br>
        <img src="Imagenes/placeholder.webp" alt="Login Image" width="100" height="50">
    </div>

    <div>
    <form action="login.php" method="POST">
        <div>
            <h3 style="text-align: center;">Welcome, please LogIn or register if you don't have an account.</h3>
        </div>

        <label for="correo">Correo:</label>
        <input type="email" id="correo" name="correo" required>

        <label for="contrasena" class="password-label">Contraseña:</label>
        <input type="password" id="contrasena" name="contrasena" required>
        <button type="button" class="register-button" onclick="togglePassword('contrasena')">👁️</button>

        <div style="margin-top:12px;">
            <input type="submit" value="Log In">
            <a href="register.html" class="register-button">Register</a>
        </div>
    </form>
    </div>


    <script>
        function togglePassword(inputId) {
    const input = document.getElementById(inputId);
    input.type = (input.type === "password") ? "text" : "password";
}
    </script>
</body>
</html>
